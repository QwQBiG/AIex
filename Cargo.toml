[workspace]
members = [
    "crates/ai-ex-domain",
    "crates/ai-ex-protocol",
    "crates/ai-ex-event-bus",
    "crates/ai-ex-stage",
    "crates/ai-ex-stage-obs",
    "crates/ai-ex-bilibili",
    "crates/ai-ex-plugin",
    "crates/ai-ex-simulator",
    "crates/ai-ex-config",
    "crates/ai-ex-core",
    "crates/ai-ex-text",
    "crates/ai-ex-memory",
    "crates/ai-ex-deepseek",
    "crates/ai-ex-ollama",
    "crates/ai-ex-koboldcpp",
    "crates/ai-ex-vts",
    "crates/ai-ex-audio",
    "crates/ai-ex-tts",
    "crates/ai-ex-duplex",
    "crates/ai-ex-asr",
    "crates/ai-ex-capture",
    "crates/ai-ex-observability",
    "crates/ai-ex-safety",
    "crates/ai-ex-control",
    "crates/ai-ex-ui-model",
    "crates/ai-ex-automation",
    "crates/ai-ex-audit",
    "crates/ai-ex-vision",
    "crates/ai-ex-migrate",
    "crates/ai-ex-service",
]
exclude = ["crates/ai-ex-desktop"]
resolver = "2"

[workspace.package]
version = "0.7.1-alpha.1"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1.89"
cpal = "0.16.0"
futures-util = "0.3.31"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rodio = { version = "0.21.1", default-features = false, features = ["playback", "wav"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.27.0", features = ["rustls-tls-native-roots"] }
toml = "0.9.5"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.0", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
