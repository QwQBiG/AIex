[package]
name = "ai-ex-platform-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-worker = []
desktop-helper = []

[[bin]]
name = "ai-ex-platform-helper"
path = "src/bin/desktop_helper.rs"
required-features = ["desktop-helper"]
test = false
bench = false

[[bin]]
name = "owned-job-test-worker"
path = "tests/support/worker.rs"
required-features = ["test-worker"]
test = false
bench = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_Storage_FileSystem", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_SystemInformation"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
