[package]
name = "ai-ex-desktop"
version = "0.7.1-alpha.1"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[dependencies]
ai-ex-config = { path = "../ai-ex-config" }
ai-ex-control = { path = "../ai-ex-control" }
ai-ex-domain = { path = "../ai-ex-domain" }
ai-ex-observability = { path = "../ai-ex-observability" }
ai-ex-ui-model = { path = "../ai-ex-ui-model" }
eframe = { version = "0.35.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence"] }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg"] }
serde_json = "1.0.143"
tokio = { version = "1.47.1", features = ["net", "rt", "sync", "time"] }
uuid = { version = "1.18.0", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
