name: Rust quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  # Hosted runners have intermittently failed while multiplexing registry requests.
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  core:
    name: Core workspace
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt

      - name: Select Rust toolchain
        run: rustup default 1.96.0

      - name: Test workspace
        run: cargo test --workspace --all-features --locked

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Enforce crate dependency boundaries
        shell: pwsh
        run: ./tools/check_architecture.ps1

      - name: Test architecture gate regressions
        shell: pwsh
        run: ./tools/test_architecture.ps1

      - name: Test development entry points
        shell: pwsh
        run: ./tools/test_development.ps1

      - name: Confirm forbidden dependencies are rejected
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./tools/check_architecture.ps1 -ProbeViolation
          if ($LASTEXITCODE -ne 1) { throw 'Architecture probe must exit 1' }
          exit 0

  development-prototype:
    name: Native development prototype
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Select Rust toolchain
        run: rustup default 1.96.0

      - name: Test prototype without Cargo or devices
        shell: pwsh
        run: ./tools/test_dev_rust_prototype.ps1 -FakeToolCompiler (Get-Command rustc).Source

  desktop:
    name: Native desktop
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt

      - name: Select Rust toolchain
        run: rustup default 1.96.0

      - name: Test desktop without opening windows
        run: cargo test --manifest-path crates/ai-ex-desktop/Cargo.toml --locked

      - name: Check desktop formatting
        run: cargo fmt --manifest-path crates/ai-ex-desktop/Cargo.toml -- --check

      - name: Lint desktop
        run: cargo clippy --manifest-path crates/ai-ex-desktop/Cargo.toml --all-targets --locked -- -D warnings

      - name: Build desktop
        run: cargo build --manifest-path crates/ai-ex-desktop/Cargo.toml --locked

  native-workers:
    name: Isolated native workers
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt

      - name: Select Rust toolchain
        run: rustup default 1.96.0

      - name: Prepare fixed Sherpa runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'sherpa-1.13.8.tar.bz2'
          $url = 'https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-win-x64-shared-MT-Release-lib.tar.bz2'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = 'b8eedf41bd6d3779218887b48367bb7a3ece5aaa7667f01f69ee823a12b0a9e7'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Sherpa runtime digest mismatch'
          }
          $root = Join-Path $env:RUNNER_TEMP 'sherpa-1.13.8'
          New-Item -ItemType Directory -Path $root | Out-Null
          tar -xf $archive -C $root
          if ($LASTEXITCODE -ne 0) { throw 'Sherpa extraction failed' }
          $library = Join-Path $root 'sherpa-onnx-v1.13.8-win-x64-shared-MT-Release-lib/lib'
          if (-not (Test-Path -LiteralPath (Join-Path $library 'sherpa-onnx-c-api.dll'))) {
            throw 'Sherpa library missing'
          }
          "SHERPA_ONNX_LIB_DIR=$library" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          $library | Out-File -LiteralPath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Test worker workspace without devices
        run: cargo test --manifest-path native-workers/Cargo.toml --workspace --locked

      - name: Lint worker workspace
        run: cargo clippy --manifest-path native-workers/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Check worker formatting
        run: cargo fmt --manifest-path native-workers/Cargo.toml --all -- --check

      - name: Build all native workers
        run: cargo build --manifest-path native-workers/Cargo.toml --workspace --locked
