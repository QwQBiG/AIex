name: Rust quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core workspace
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt

      - name: Select Rust toolchain
        run: rustup default 1.96.0

      - name: Test workspace
        run: cargo test --workspace --all-features --locked

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Enforce crate dependency boundaries
        shell: pwsh
        run: ./tools/check_architecture.ps1

      - name: Test architecture gate regressions
        shell: pwsh
        run: ./tools/test_architecture.ps1

      - name: Confirm forbidden dependencies are rejected
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./tools/check_architecture.ps1 -ProbeViolation
          if ($LASTEXITCODE -ne 1) { throw 'Architecture probe must exit 1' }
          exit 0

  desktop:
    name: Native desktop
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt

      - name: Select Rust toolchain
        run: rustup default 1.96.0

      - name: Test desktop without opening windows
        run: cargo test --manifest-path crates/ai-ex-desktop/Cargo.toml --locked

      - name: Check desktop formatting
        run: cargo fmt --manifest-path crates/ai-ex-desktop/Cargo.toml -- --check

      - name: Lint desktop
        run: cargo clippy --manifest-path crates/ai-ex-desktop/Cargo.toml --all-targets --locked -- -D warnings

      - name: Build desktop
        run: cargo build --manifest-path crates/ai-ex-desktop/Cargo.toml --locked
